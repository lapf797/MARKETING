name: Analisar catalogo do leilao (sob demanda)

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "URL publica do PDF do catalogo do leilao"
        required: true
      leilao:
        description: "Nome do leilao (agrupa todos os lotes deste catalogo no dashboard)"
        required: true
      link_url:
        description: "URL de destino (landing page) que os anuncios vao usar (opcional)"
        required: false
      account_id:
        description: "ID da conta de anuncios Meta (opcional — usa FB_AD_ACCOUNT_ID por padrao)"
        required: false
      page_id:
        description: "ID da pagina do Facebook (opcional — pode ser definido depois, na aprovacao)"
        required: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar analise do catalogo (todos os lotes)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_TOKEN_ENDPOINT_URL: ${{ secrets.FB_TOKEN_ENDPOINT_URL }}
          FB_TOKEN_API_KEY: ${{ secrets.FB_TOKEN_API_KEY }}
          FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_PDF_URL: ${{ inputs.pdf_url }}
          INPUT_LEILAO: ${{ inputs.leilao }}
          INPUT_LINK_URL: ${{ inputs.link_url }}
          INPUT_ACCOUNT_ID: ${{ inputs.account_id }}
          INPUT_PAGE_ID: ${{ inputs.page_id }}
        run: python scripts/run_analyze_catalog_from_env.py

      - name: Commit dos dados do dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ad_drafts.json docs/drafts_data.json
          git diff --cached --quiet || git commit -m "chore: rascunhos do catalogo do leilao (analise sob demanda)"
          git push
