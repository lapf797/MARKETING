name: Deploy do login com Facebook (Firebase)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy das Cloud Functions e regras do Firestore
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "{\"projects\":{\"default\":\"$FIREBASE_PROJECT_ID\"}}" > .firebaserc
          firebase deploy --only functions,firestore:rules \
            --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
